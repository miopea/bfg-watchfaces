# :mobile dexes the generator, the Watch Face Push validator and play-services
# into five dex files, and D8 runs out of the default heap doing it -- as
# "OutOfMemoryError: Java heap space" inside mergeExtDexDebug, which reads like a
# CI flake and is not. It built locally only because this machine's daemon had
# more room to begin with. Pinning it makes the build the same everywhere.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g


# Required by every AndroidX dependency, and Watch Face Push is one. Without it
# :wear fails at checkDebugAarMetadata rather than at compile, which reads like
# a dependency problem and is not.
android.useAndroidX=true
