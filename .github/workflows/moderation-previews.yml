name: moderation previews

on:
  # Manual recovery path. The BGS Dev systemd timer owns recurring processing;
  # GitHub schedules were delayed by over an hour in production.
  workflow_dispatch:

concurrency:
  group: bfg-watchfaces-moderation-previews
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4

      # The moderation pass refuses to run without Google's schema and Xerces.
      # That refusal is the safety boundary: a missing validator cannot look
      # like an empty list of problems.
      - run: scripts/bootstrap.sh

      - name: Render and sync technical reviews
        env:
          BFG_CATALOG_URL: https://bfg-catalog.bfg-solutions.workers.dev
          BFG_MODERATOR_TOKEN: ${{ secrets.BFG_MODERATOR_TOKEN }}
        run: ./gradlew :workbench:moderate
