name: CI
on: [push, pull_request]

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4

      # Fetches Google's WFF schemas and the XSD 1.1 jars. Not committed --
      # they belong to Google and Apache, and pinning a stale schema copy is
      # how you end up validating against last year's spec.
      - run: scripts/bootstrap.sh

      # No Android SDK, no emulator. The generator is deliberately pure JVM so
      # that the piece under most active development is also the fastest to check.
      - run: ./gradlew :generator:test

      # The workbench owns the rasterizer, so it now owns artwork that ships
      # inside the APK. Determinism, quantization budget and the ambient
      # lit-pixel ceiling are all covered here.
      - run: ./gradlew :workbench:test

      # Smoke the headless bake. This is the path build.sh depends on, and it
      # refuses to write a schema-invalid face, so a green bake is also a
      # statement that the emitted WFF validates.
      - run: ./gradlew :workbench:bake
      - name: bake produced the artwork build.sh requires
        run: |
          # set -e explicitly. GitHub's default shell supplies it, but a bare
          # list of `test` calls reports the exit of the LAST one, so without it
          # a missing dial_bg.png passes silently -- a check measuring nothing.
          set -euo pipefail
          test -s watchface-template/res/drawable-nodpi/dial_bg.png
          test -s watchface-template/res/drawable-nodpi/preview.png
          test -s watchface-template/res/raw/watchface.xml

      # Every catalog submission must parse, render, and emit schema-valid WFF.
      # docs/SPEC.md says invalid faces are rejected before human review -- which
      # is only true if a bad face FAILS THE BUILD. A reviewer cannot see that a
      # face is schema-invalid by reading the diff, and on a watch the failure is
      # silence, not an error.
      #
      # --check also fails on a stale index.json, so the generated file cannot
      # drift from the faces it indexes.
      - run: ./gradlew :workbench:catalog --args="--check"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: |
            generator/build/reports/tests/test
            workbench/build/reports/tests/test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # markdownlint + cspell over every tracked and untracked-but-not-ignored
      # markdown file. Configs are the shared fleet ones from claude-team-config;
      # project vocabulary lives in this repo's cspell.json, not in rcg-terms.txt.
      - run: make docs-check
