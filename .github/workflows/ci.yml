name: CI
on: [push, pull_request]

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4

      # Fetches Google's WFF schemas and the XSD 1.1 jars. Not committed --
      # they belong to Google and Apache, and pinning a stale schema copy is
      # how you end up validating against last year's spec.
      - run: scripts/bootstrap.sh

      # The generator is deliberately pure JVM so the piece under most active
      # development is also the fastest to check. The Android modules are in the
      # build now, so Gradle configures them here, but nothing Android is
      # compiled or run by this job.
      - run: ./gradlew :generator:test

      # The workbench owns the rasterizer, so it now owns artwork that ships
      # inside the APK. Determinism, quantization budget and the ambient
      # lit-pixel ceiling are all covered here.
      - run: ./gradlew :workbench:test

      # Smoke the headless bake. This is the path build.sh depends on, and it
      # refuses to write a schema-invalid face, so a green bake is also a
      # statement that the emitted WFF validates.
      - run: ./gradlew :workbench:bake
      - name: bake produced the artwork build.sh requires
        run: |
          # set -e explicitly. GitHub's default shell supplies it, but a bare
          # list of `test` calls reports the exit of the LAST one, so without it
          # a missing dial_bg.png passes silently -- a check measuring nothing.
          set -euo pipefail
          test -s watchface-template/res/drawable-nodpi/dial_bg.png
          test -s watchface-template/res/drawable-nodpi/preview.png
          test -s watchface-template/res/raw/watchface.xml

      # No catalog step here. The catalog moved to its own public repository and
      # is validated by ITS CI, using this validator. Running --check here would
      # find no checkout, print "nothing to validate" and pass -- a step that
      # measures nothing, which is the defect this file exists to avoid.
      #   https://github.com/miopea/bfg-watchfaces-catalog

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: |
            generator/build/reports/tests/test
            workbench/build/reports/tests/test

  # The Android modules were scaffolds nobody had ever built, which is how both
  # of them ended up pinned to versions that could not resolve and to a
  # compileSdk the Watch Face Push library rejects. Building them here is what
  # stops that happening again.
  #
  # Nothing is RUN: there is no emulator and Watch Face Push needs Wear OS 6
  # hardware. This proves the APKs assemble and contain what they must, which is
  # a smaller claim than "it works" and is stated as such.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4

      # compileSdk 36 explicitly: androidx.wear.watchfacepush:1.0.0 refuses to
      # be compiled against anything lower, and the runner image is not
      # guaranteed to carry it.
      - name: Android SDK 36
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - run: ./gradlew :wear:assembleDebug :mobile:assembleDebug

      - name: the APKs contain what they must, and nothing they must not
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          WEAR=wear/build/outputs/apk/debug/wear-debug.apk
          MOBILE=mobile/build/outputs/apk/debug/mobile-debug.apk
          test -s "$WEAR" && test -s "$MOBILE"

          # The watch app is the only one that can hold this, and the whole
          # activation design depends on it being declared.
          "$BT/aapt2" dump badging "$WEAR" \
            | grep -q "com.google.wear.permission.SET_PUSHED_WATCH_FACE_AS_ACTIVE"

          # Both must ship under the frozen applicationId. Watch Face Push
          # derives every face package from it and it can never change after
          # the first Play release.
          for apk in "$WEAR" "$MOBILE"; do
            "$BT/aapt2" dump badging "$apk" | grep -q "package: name='com.bfg.watchfaces'"
          done

          # :workbench is dev tooling and is NOT shipped. If it ever leaks into
          # an APK, the localhost server and the catalog writer go with it.
          for apk in "$WEAR" "$MOBILE"; do
            if unzip -p "$apk" 'classes*.dex' | strings | grep -q "com/bfg/watchfaces/workbench"; then
              echo "FAIL: $apk contains :workbench code" >&2; exit 1
            fi
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # markdownlint + cspell over every tracked and untracked-but-not-ignored
      # markdown file. Configs are the shared fleet ones from claude-team-config;
      # project vocabulary lives in this repo's cspell.json, not in rcg-terms.txt.
      - run: make docs-check
